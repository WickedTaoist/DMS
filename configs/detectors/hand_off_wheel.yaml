# ------------------------------------------------------------
# 手离方向盘 detector 配置 / Hand-off-wheel detector configuration
# ------------------------------------------------------------

# detector 名称，应与 registry 中的 key 保持一致。
# Detector name; should match the registry key.
detector: hand_off_wheel

# 手离方向盘判定阈值。
# Threshold for hand-off-wheel decision.
off_threshold: 0.5

# 后续真实模型或规则文件路径。
# Path to the future real model or rule asset.
model_path: models/custom/hand_off_wheel.pt
