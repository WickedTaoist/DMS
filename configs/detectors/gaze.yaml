# ------------------------------------------------------------
# 视线 detector 配置 / Gaze detector configuration
# ------------------------------------------------------------

# detector 名称，应与 registry 中的 key 保持一致。
# Detector name; should match the registry key.
detector: gaze

# 视线下移阈值，超过该值可视为 gaze downward。
# Downward-gaze threshold.
gaze_down_threshold: 10.0

# 真实 gaze 模型路径。
# Path to the real gaze estimation model.
model_path: models/openvino/gaze.xml
